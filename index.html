function goalCard(g){const p=progress(g);const done=p>=1;let dl="";if(g.deadline){const d=dayDiff(today(),g.deadline);dl=d<0?"Échéance dépassée":"J-"+d+" · "+fmtDay(g.deadline,{day:"numeric",month:"short",year:"numeric"});}
  return'<article class="card goal'+(done?" done":"")+'" data-id="'+g.id+'"><div><div class="eb">'+(g.domain==="pro"?"Pro":"Perso")+(done?" · Tenu":"")+'</div><h3>'+esc(g.title)+'</h3></div>'+
  '<div class="big"><b>'+num(g.current)+'</b><span>'+esc(g.unit||"")+' · cible '+num(g.target)+'</span></div><div class="line"><i style="width:'+(p*100).toFixed(1)+'%"></i></div>'+
  '<div class="ft"><span class="pc">'+Math.round(p*100)+' % du chemin</span><span>'+esc(dl)+'</span></div>'+
  '<div class="acts" data-acts>'+(done?"":'<button class="b sm p" data-act="upd">Mettre à jour</button>')+'<button class="lnk" data-act="edit-goal">Modifier</button><button class="lnk" data-act="del-goal">Retirer</button></div></article>';}
function taskRow(t){return'<div class="row task'+(t.done?" done":"")+'" data-id="'+t.id+'"><button class="chk'+(t.done?" on":"")+'" data-act="toggle" aria-label="'+(t.done?"Rouvrir":"Terminer")+'">'+CHECK+'</button>'+
  '<span class="tt" data-act="rename" tabindex="0">'+esc(t.title)+'</span>'+dueBadge(t)+(t.done?"":'<button class="star'+(t.focus?" on":"")+'" data-act="focus" aria-label="Focus du jour" title="Focus du jour">★</button>')+'<button class="x" data-act="del" aria-label="Supprimer">×</button></div>';}
function col(dom){const open=S.tasks.filter(t=>t.domain===dom&&!t.done).sort((a,b)=>(b.focus-a.focus)||((a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:a.created-b.created));
  const done=S.tasks.filter(t=>t.domain===dom&&t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  return'<section class="card col" data-dom="'+dom+'"><header><h2>'+(dom==="pro"?"Pro":"Perso")+'</h2><span class="eb">'+open.length+' en cours</span></header>'+
  '<form class="add" data-add="'+dom+'" autocomplete="off"><input class="in" placeholder="Nouvelle tâche '+dom+'" aria-label="Nouvelle tâche '+dom+'"><input class="in" type="date" aria-label="Échéance"><button class="b p" type="submit">Ajouter</button></form>'+
  '<div class="rows">'+(open.length?open.map(taskRow).join(""):'<p class="empty" style="padding:.7rem 0">Rien en cours.</p>')+'</div>'+
  (done.length?'<button class="more" data-act="more" data-dom="'+dom+'">'+(ui.doneOpen[dom]?"Masquer":"Voir")+' les '+done.length+' terminée'+(done.length>1?"s":"")+'</button>'+(ui.doneOpen[dom]?'<div class="rows" style="margin-top:.6rem">'+done.slice(0,40).map(taskRow).join("")+'</div>':""):"")+'</section>';}
function vActions(){return'<div class="page"><header class="vh"><div><div class="eb">Actions</div><h1>Ce que tu fais, <i>ce que tu vises</i></h1></div><button class="b" data-act="new-goal">Nouvel objectif</button></header>'+
  '<div class="sh"><span class="eb">Objectifs</span></div><div class="goals">'+(S.goals.length?S.goals.map(goalCard).join(""):'<p class="empty">Aucun objectif.</p>')+'</div>'+
  '<div class="sh"><span class="eb">Tâches</span></div><div class="cols">'+col("pro")+col("perso")+'</div></div>';}
function bindActions(){
  const m=$("#main");
  const submit=e=>{const f=e.target.closest("[data-add]");if(!f)return;e.preventDefault();const [ti,da]=f.querySelectorAll("input");const t=ti.value.trim();if(!t)return;
    S.tasks.push({id:uid(),title:t,domain:f.dataset.add,done:false,focus:false,due:da.value||"",created:now()});commit();render();const nf=$('[data-add="'+f.dataset.add+'"] input');if(nf)nf.focus();};
  const click=e=>{const a=e.target.closest("[data-act]");if(!a)return;const host=a.closest("[data-id]");
    const t=host&&S.tasks.find(x=>x.id===host.dataset.id),g=host&&S.goals.find(x=>x.id===host.dataset.id);const k=a.dataset.act;
    if(k==="new-goal")return goalDlg();
    if(k==="more"){ui.doneOpen[a.dataset.dom]=!ui.doneOpen[a.dataset.dom];return render();}
    if(t){if(k==="toggle"){t.done=!t.done;t.doneAt=t.done?now():null;if(t.done)t.focus=false;commit();a.classList.toggle("on");setTimeout(render,t.done?320:0);}
      if(k==="focus"){if(!t.focus&&S.tasks.filter(x=>x.focus&&!x.done).length>=3){toast("Trois tâches en focus maximum. Retire une étoile d'abord.");return;}t.focus=!t.focus;commit();render();}
      if(k==="del"){S.tasks=S.tasks.filter(x=>x!==t);commit();render();}
      if(k==="rename"&&!t.done){a.contentEditable="true";a.focus();const fin=()=>{a.contentEditable="false";t.title=a.innerText.trim()||t.title;commit();a.removeEventListener("blur",fin);};a.addEventListener("blur",fin);
        a.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key==="Escape"){ev.preventDefault();a.blur();}});}}
    if(g){if(k==="upd"){const box=host.querySelector("[data-acts]");box.innerHTML='<form class="upd"><input class="in" type="number" step="any" value="'+esc(g.current)+'" aria-label="Nouvelle valeur"><button class="b sm p">Valider</button><button type="button" class="lnk" data-act="cancel">Annuler</button></form>';
        const fm=box.querySelector("form"),inp=fm.querySelector("input");inp.focus();inp.select();
        fm.addEventListener("submit",ev=>{ev.preventDefault();const v=Number(inp.value);if(!isFinite(v))return;const was=progress(g);g.current=v;g.history=(g.history||[]).concat([{at:now(),v}]);commit();render();if(progress(g)>=1&&was<1)toast("Objectif tenu : "+g.title);});}
      if(k==="cancel")render();
      if(k==="edit-goal")goalDlg(g);
      if(k==="del-goal")confirmDlg("Retirer l'objectif « "+g.title+" » ?","Il disparaît de l'accueil et des actions.","Retirer",()=>{S.goals=S.goals.filter(x=>x!==g);commit();render();});}
  };
  m.addEventListener("submit",submit);m.addEventListener("click",click);teardown=()=>{m.removeEventListener("submit",submit);m.removeEventListener("click",click);};
}

function overlay(html,cls){const r=$("#ovroot");r.innerHTML='<div class="ov" id="ov"><div class="'+cls+'" role="dialog" aria-modal="true">'+html+'</div></div>';
  $("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeOverlay();});return r.firstChild;}
function closeOverlay(){const r=$("#ovroot");if(!r.innerHTML)return false;r.innerHTML="";return true;}
function confirmDlg(title,msg,label,fn){const o=overlay('<div class="eb">Confirmer</div><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p><div class="ft"><button class="b" data-c="no">Annuler</button><button class="b p" data-c="yes">'+esc(label)+'</button></div>',"dlg");
  o.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;closeOverlay();if(b.dataset.c==="yes")fn();});o.querySelector('[data-c="yes"]').focus();}
function goalDlg(g){const x=g||{title:"",domain:"perso",unit:"",start:0,current:0,target:"",deadline:""};

    if(!d.title)return;if(g)Object.assign(g,d);else S.goals.push(Object.assign({id:uid()},d));commit();closeOverlay();render();});}

/* Palette Ctrl+K */
function openPalette(opt){opt=opt||{};
  const o=overlay('<input id="pq" placeholder="'+(opt.pick?"Choisir une note à poser sur le board":"Chercher une note, une carte, une tâche, ou une action")+'" autocomplete="off" aria-label="Recherche"><div class="res" id="pres"></div>',"pal");
  const q=o.querySelector("#pq"),res=o.querySelector("#pres");let items=[],sel=0;
  const actions=[{k:"Action",l:"Nouvelle note",run:()=>newNote()},{k:"Action",l:"Nouvelle carte mentale",run:()=>{const m=newMap();go("map",{mapId:m.id,mapSel:m.root.id});setTimeout(()=>editNode(m.root.id),50);}},
    {k:"Action",l:"Ajouter une image au vision board",run:()=>{go("board");setTimeout(()=>{const b=$('[data-add="image"]');if(b)b.click();},50);}},{k:"Action",l:"Nouvel objectif",run:()=>{go("actions");goalDlg();}},
    {k:"Action",l:"Nouveau rendez-vous",run:()=>{go("agenda");eventDlg(null,{date:today()});}},
    ...VIEWS.map(([k,l])=>({k:"Aller à",l,run:()=>go(k)})),{k:"Action",l:"Réglages, citation et sauvegarde",run:()=>go("settings")}];
  function build(){const t=norm(q.value).trim();
    const notes=sortedNotes().map(n=>({k:"Note",l:n.title||"Sans titre",sub:rel(n.updated),score:!t?1:norm(n.title).includes(t)?3:norm(n.body).includes(t)?1:0,run:()=>opt.pick?opt.onPick(n.id):openNote(n.id)}));
    if(opt.pick)items=notes.filter(x=>x.score).slice(0,30);
    else{const maps=S.maps.map(m=>({k:"Carte",l:m.root.text,score:!t||norm(m.root.text).includes(t)?2:0,run:()=>go("map",{mapId:m.id,mapSel:null})}));
      const tasks=S.tasks.filter(x=>!x.done).map(x=>({k:x.domain==="pro"?"Tâche pro":"Tâche perso",l:x.title,score:t&&norm(x.title).includes(t)?2:0,run:()=>go("actions")}));
      const acts=actions.map(a=>Object.assign({score:!t||norm(a.l).includes(t)?(t?2.5:.5):0},a));
      const evs=S.events.filter(e=>!isPast(e)||(t&&norm(e.title).includes(t))).sort((a,b)=>a.date<b.date?-1:1).map(e=>({k:"Rdv",l:e.title,sub:fmtDay(e.date,{weekday:"short",day:"numeric",month:"short"})+(e.allDay?"":" "+e.start),
        score:t&&norm(e.title+" "+(e.place||"")).includes(t)?2.2:0,run:()=>{go("agenda",{agDate:e.date,agMode:"week"});eventDlg(e);}}));
      items=[...acts,...notes,...maps,...tasks,...evs].filter(x=>x.score).sort((a,b)=>b.score-a.score).slice(0,40);
      if(t&&!items.some(x=>x.k==="Note"&&norm(x.l)===t))items.push({k:"Créer",l:"Note « "+q.value.trim()+" »",run:()=>newNote(q.value.trim())});}
    sel=0;draw();}
  function draw(){res.innerHTML=items.length?items.map((x,i)=>'<button class="it" data-i="'+i+'" aria-selected="'+(i===sel)+'"><span class="k">'+esc(x.k)+'</span><span class="l">'+esc(x.l)+'</span>'+(x.sub?'<small>'+esc(x.sub)+'</small>':"")+'</button>').join(""):'<p class="none">Rien trouvé.</p>';
    const s=res.querySelector('[aria-selected="true"]');if(s)s.scrollIntoView({block:"nearest"});}
  const run=i=>{const x=items[i];if(!x)return;closeOverlay();x.run();};
  q.addEventListener("input",build);
  q.addEventListener("keydown",e=>{if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(items.length-1,sel+1);draw();}else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);draw();}else if(e.key==="Enter"){e.preventDefault();run(sel);}});
  res.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)run(+b.dataset.i);});
  build();q.focus();
}

function vSettings(){
  const sp=S.splash,fsOK="showDirectoryPicker" in window;
  return'<div class="page"><header class="vh"><div><div class="eb">Réglages</div><h1>Ton <i>VB</i></h1></div></header><div class="set">'+
  '<section class="card"><header><h2>Écran d\'ouverture</h2><button class="b sm" data-s="replay">Revoir l\'ouverture</button></header>'+
    '<div class="sp-prev"><blockquote id="pv-q">'+esc(sp.quote)+'</blockquote><div class="eb" id="pv-by">'+esc(sp.by)+'</div></div>'+
    '<label class="fl">Citation<textarea class="in" id="set-q" rows="3" maxlength="240">'+esc(sp.quote)+'</textarea></label>'+
    '<label class="fl">Signature (facultatif)<input class="in" id="set-by" maxlength="60" value="'+esc(sp.by)+'" placeholder="Ton nom, un auteur, une date"></label>'+
    '<label class="ck2"><input type="checkbox" id="set-on"'+(sp.on!==false?" checked":"")+'> Afficher l\'ouverture à chaque lancement</label></section>'+
  '<section class="card"><header><h2>Où vit VB</h2></header><p class="muted">'+storageText()+'</p><div class="opts">'+
    (fsOK&&B.kind!=="mem"&&!APPMODE?'<button class="b p" data-s="folder">'+(B.kind==="fs"?"Ouvrir un autre dossier":"Déplacer vers un dossier de mon ordi")+'</button>':"")+
    '<button class="b" data-s="export">Exporter une sauvegarde</button><button class="b" data-s="import">Importer une sauvegarde</button></div></section>'+
  '<section class="card"><header><h2>Installer VB</h2></header><p class="muted" id="inst-txt">'+installText()+'</p><div class="opts">'+(installEvt?'<button class="b p" data-s="install">Installer VB sur cet appareil</button>':"")+'</div>'+
  '<p class="muted" style="margin:1.2rem 0 0;font-size:.8rem">Version '+VB_VERSION+'. Les mises à jour arrivent toutes seules au lancement.</p></section>'+
  '</div></div>';
}
function installText(){if(STANDALONE)return"VB est installé sur cet appareil. Il se met à jour tout seul à chaque lancement.";
  if(/iPhone|iPad|iPod/.test(navigator.userAgent))return"Sur iPhone : ouvre ce lien dans Safari, touche le bouton Partager, puis « Sur l'écran d'accueil ».";
  if(installEvt)return"Installe VB comme une vraie app : icône, fenêtre à elle, fonctionne hors connexion.";
  return location.protocol==="file:"?"Cette version vient d'un fichier. La version installable est sur vbtwelve.github.io/vb.":"Dans Chrome ou Edge : menu ⋮, puis « Installer VB » (ou l'icône d'installation à droite de la barre d'adresse). Sur Android : menu ⋮, puis « Ajouter à l'écran d'accueil ».";}
function bindSettings(){
  const m=$("#main"),q=$("#set-q"),by=$("#set-by"),on=$("#set-on");
  const upd=()=>{S.splash.quote=q.value.trim()||DEFAULT_QUOTE;S.splash.by=by.value.trim();S.splash.on=on.checked;$("#pv-q").textContent=S.splash.quote;$("#pv-by").textContent=S.splash.by;cacheSplash();commit();};
  q.addEventListener("input",upd);by.addEventListener("input",upd);on.addEventListener("change",()=>{upd();toast(on.checked?"L'ouverture s'affichera à chaque lancement":"VB s'ouvrira directement");});
  const click=async e=>{const b=e.target.closest("[data-s]");if(!b)return;const k=b.dataset.s;
    if(k==="replay")showSplash(S.splash,()=>"ready",()=>revealShell());
    if(k==="install"&&installEvt){installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;render();}
    if(k==="folder")await pickFolder(B.kind!=="fs");
    if(k==="export"){const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vb-sauvegarde-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Sauvegarde exportée (sans les images)");}
    if(k==="import"){const fi=document.createElement("input");fi.type="file";fi.accept="application/json,.json";fi.onchange=async()=>{try{const s=JSON.parse(await fi.files[0].text());if(!s.notes)throw new Error("fichier non reconnu");S=migrate(s);S.notes.forEach(n=>dirtyNotes.add(n.id));cacheSplash();commit();render();toast("Sauvegarde importée");}catch(err){toast("Import impossible : "+err.message);}};fi.click();}
  };
  m.addEventListener("click",click);teardown=()=>m.removeEventListener("click",click);
}

let toastT=null;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}

/* ===================== Clavier global ===================== */
document.addEventListener("keydown",e=>{
  const t=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable;
  if(!S)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(!closeOverlay())openPalette();return;}
  if(e.altKey&&e.key.toLowerCase()==="n"){e.preventDefault();closeOverlay();newNote();return;}
  if(e.key==="Escape"&&closeOverlay())return;
  if($("#ovroot").innerHTML||typing)return;
  if(ui.view==="board"&&ui.boardSel&&(e.key==="Delete"||e.key==="Backspace")){e.preventDefault();removeBoardItem(ui.boardSel);}
  else if(ui.view==="map")mapKey(e);
  else if(ui.view==="graph"&&GRAPH)GRAPH.key(e);
});
document.addEventListener("paste",e=>{if(!S||ui.view!=="board")return;const t=e.target;if(/^(INPUT|TEXTAREA)$/.test(t.tagName)||t.isContentEditable)return;
  const files=[...(e.clipboardData&&e.clipboardData.files||[])];if(files.length){e.preventDefault();addImages(files,centerWorld());}});
$("#open-pal").addEventListener("click",()=>openPalette());
$("#open-settings").addEventListener("click",()=>go("settings"));

/* ===================== Environnement ===================== */
const STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const WEBAPP=/github\.io$/.test(location.hostname);
const APPMODE=/[?&]app=1(&|$)/.test(location.search)||STANDALONE||WEBAPP;
const VB_VERSION="2026.10.18-3";if(/[?&]test=1\b/.test(location.search))window.__VB={get S(){return S;},get G(){return GRAPH;}};
const FRAMED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
let envHidden=false;
function envCheck(){const bar=$("#envbar");let t="";
  if(FRAMED)t="Tu es dans un aperçu : tu peux tout essayer, mais rien ne sera gardé. Pour utiliser VB pour de vrai, ouvre VB.html dans Chrome.";
  else if(B&&B.kind==="mem")t="Ce navigateur n'enregistre rien. Ouvre VB.html avec Chrome ou Edge.";
  $("#envtxt").textContent=t;bar.hidden=!t||envHidden;}
$("#envx").addEventListener("click",()=>{envHidden=true;$("#envbar").hidden=true;});

/* ===================== Ouverture immersive ===================== */
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
function cachedSplash(){try{return JSON.parse(localStorage.getItem("vb.splash")||"null");}catch(e){return null;}}
function cacheSplash(){try{localStorage.setItem("vb.splash",JSON.stringify(S.splash));}catch(e){}}
let SP=null;
function showSplash(sp,onEnter,onDone){
  const el=$("#splash");el.hidden=false;el.className="splash";
  const words=String(sp.quote||DEFAULT_QUOTE).split(/\s+/).filter(Boolean);const base=RM?0:.45;
  $("#sp-q").innerHTML=words.map((w,i)=>'<span class="w" style="animation-delay:'+(base+i*.11).toFixed(2)+'s">'+esc(w)+'</span>').join(" ");
  const after=base+words.length*.11+.4;
  $("#sp-by").textContent=sp.by||"";$("#sp-by").style.animationDelay=after+"s";$("#sp-cta").style.animationDelay=(after+.5)+"s";
  // champ d'étoiles en profondeur
  const c=$("#sp-cv"),x=c.getContext("2d");let W=0,H=0,dpr=1,raf=0,speed=.0011,mx=0,my=0,tx=0,ty=0;
  const N=Math.round(Math.min(420,innerWidth*innerHeight/4200));
  const stars=[...Array(N)].map(()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random(),w:Math.random()<.14}));
  const size=()=>{dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;};size();addEventListener("resize",size);
  const mm=e=>{tx=(e.clientX/W-.5);ty=(e.clientY/H-.5);};addEventListener("mousemove",mm);
  const frame=()=>{x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);mx+=(tx-mx)*.04;my+=(ty-my)*.04;
    const cx=W/2-mx*40,cy=H/2-my*40,f=Math.max(W,H)*.5;
    for(const s of stars){const pz=s.z;s.z-=speed;if(s.z<=.02){s.z=1;s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;continue;}
      const sx=cx+s.x/s.z*f*.6,sy=cy+s.y/s.z*f*.6,px=cx+s.x/pz*f*.6,py=cy+s.y/pz*f*.6;
      if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;const a=Math.min(1,(1-s.z)*1.3),r=(1-s.z)*1.6+.2;
      x.strokeStyle=x.fillStyle=s.w?"rgba(207,69,96,"+a+")":"rgba(236,214,190,"+(a*.85)+")";
      if(speed>.004){x.lineWidth=r;x.beginPath();x.moveTo(px,py);x.lineTo(sx,sy);x.stroke();}else{x.beginPath();x.arc(sx,sy,r,0,6.283);x.fill();}}
    raf=requestAnimationFrame(frame);};
  if(!RM)raf=requestAnimationFrame(frame);
  let busy=false;
  const enter=()=>{if(busy)return;busy=true;
    const pr=Promise.resolve().then(()=>null);const res=onEnter(); // appelé tout de suite : garde le geste utilisateur (permission dossier)
    el.classList.add("go");if(!RM){const t0=performance.now();const acc=()=>{const k=Math.min(1,(performance.now()-t0)/1100);speed=.0011+k*k*.05;if(k<1)requestAnimationFrame(acc);};acc();}
    Promise.all([Promise.resolve(res),new Promise(r=>setTimeout(r,RM?150:1150))]).then(([r])=>{el.classList.add("out");
      setTimeout(()=>{cancelAnimationFrame(raf);removeEventListener("resize",size);removeEventListener("mousemove",mm);el.hidden=true;el.className="splash";el.removeEventListener("click",enter);el.removeEventListener("keydown",key);SP=null;},600);
      onDone(r);});};
  const key=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();enter();}};
  el.addEventListener("click",enter);el.addEventListener("keydown",key);setTimeout(()=>el.focus(),50);
  SP={enter};
}
function revealShell(){const sh=$("#shell");if(RM)return;sh.classList.remove("reveal");void sh.offsetWidth;sh.classList.add("reveal");}

/* ===================== Démarrage ===================== */
function start(reveal){$("#gate").hidden=true;$("#shell").hidden=false;setStatus(B.kind==="mem"?"mem":"ok");render();envCheck();if(reveal)revealShell();}
async function pickFolder(migrateCurrent){
  try{const h=await window.showDirectoryPicker({id:"cerveau",mode:"readwrite"});await useFolder(h,migrateCurrent);}
  catch(e){if(e.name!=="AbortError")toast("Impossible d'ouvrir ce dossier : "+e.message);}
}
async function loadFolder(h,migrateCurrent){
  const fs=makeFS();await fs.init(h);let s=await fs.load();let fresh=false;
  if(!s){fresh=true;if(migrateCurrent&&S){s=S;for(const it of S.board.items.filter(i=>i.type==="image")){const f=await B.getFile(it.src);if(f)await fs.putFile(it.src,f);}}else s=seed();}
  else if(migrateCurrent&&S)toast("Ce dossier contient déjà des données VB : je les ouvre telles quelles.");
  B=fs;folderName=h.name;S=migrate(s);urlCache.clear();cacheSplash();
  try{await IDB.set("mode","fs");await IDB.set("dir",h);}catch(e){}
  if(fresh){S.notes.forEach(n=>dirtyNotes.add(n.id));commit();}
}
async function useFolder(h,migrateCurrent){await loadFolder(h,migrateCurrent);start(true);}
async function loadIDB(){B=IDBB;let s=await IDBB.load();const fresh=!s;S=migrate(s||seed());cacheSplash();try{await IDB.set("mode","idb");}catch(e){}if(fresh)commit();}
async function useIDB(){await loadIDB();start(true);}
function useMem(msg){B=MEM;S=migrate(seed());start(true);if(msg)toast(msg);}
function gate(kind,handle){
  const g=$("#gate");g.hidden=false;if(!RM){g.classList.remove("reveal");void g.offsetWidth;g.classList.add("reveal");}
  const fsOK="showDirectoryPicker" in window&&!FRAMED;const acts=$("#gate-acts"),note=$("#gate-note");
  if(kind==="reopen"){$("#gate-p").textContent="VB t'attend dans le dossier « "+handle.name+" ». Chrome demande juste ta permission pour le rouvrir.";
    acts.innerHTML='<button class="b p" id="g-re">Rouvrir « '+esc(handle.name)+' »</button><button class="b" id="g-other">Choisir un autre dossier</button>';
    $("#g-re").onclick=async()=>{try{const p=await handle.requestPermission({mode:"readwrite"});if(p==="granted")await useFolder(handle,false);else toast("Permission refusée.");}catch(e){toast("Impossible : "+e.message);}};
    $("#g-other").onclick=()=>pickFolder(false);note.textContent="";return;}
  acts.innerHTML=(fsOK?'<button class="b p" id="g-fs">Choisir mon dossier VB</button>':"")+'<button class="b" id="g-idb">'+(fsOK?"Essayer sans dossier":FRAMED?"Essayer dans l'aperçu":"Commencer")+'</button>';
  if(fsOK)$("#g-fs").onclick=()=>pickFolder(false);
  $("#g-idb").onclick=()=>{if(!IDB.db)return useMem();useIDB().catch(e=>useMem("Mode secours : "+e.message));};
  note.textContent=FRAMED?"Tu es dans un aperçu : rien ne sera gardé. Pour utiliser VB pour de vrai, télécharge VB.html et ouvre-le dans Chrome."
    :fsOK?"Conseil : crée un dossier « VB » dans Documents (ou sur ta clé USB) et choisis-le. Si le dossier contient déjà des données VB, elles s'ouvrent telles quelles."
    :"Ce navigateur ne sait pas écrire dans un dossier. Ouvre VB.html avec Chrome ou Edge pour garder tes données sur ton ordinateur.";
}
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;const b=$("#inst-btn");if(b)b.hidden=false;if(S&&ui.view==="settings")render();});
window.addEventListener("appinstalled",()=>{installEvt=null;const b=$("#inst-btn");if(b)b.hidden=true;toast("VB est installé sur cet appareil");});
$("#inst-btn").addEventListener("click",async()=>{if(!installEvt)return go("settings");installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;$("#inst-btn").hidden=true;});
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!FRAMED){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e));});}
async function boot(){
  let plan="first",h=null;
  try{await IDB.open();const mode=await IDB.get("mode");h=await IDB.get("dir");
    if(mode==="fs"&&h&&h.queryPermission){let p="prompt";try{p=await h.queryPermission({mode:"readwrite"});}catch(e){}
      if(p==="granted"){await loadFolder(h,false);plan="ready";}else plan="reopen";}
    else if(mode==="idb"||APPMODE){await loadIDB();plan="ready";}
    if(APPMODE&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){console.warn(e);}
  const sp=(plan==="ready"&&S&&S.splash)||cachedSplash()||{quote:DEFAULT_QUOTE,by:"",on:true};
  if(sp.on===false){$("#splash").hidden=true;if(plan==="ready")start(false);else gate(plan,h);return;}
  showSplash(sp,()=>{
    if(plan!=="reopen")return plan;
    return h.requestPermission({mode:"readwrite"}).then(async p=>{if(p==="granted"){await loadFolder(h,false);return"ready";}return"reopen";}).catch(()=>"reopen");
  },r=>{if(r==="ready")start(true);else gate(r,h);});
}
boot();
})();
</script>
